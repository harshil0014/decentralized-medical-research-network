name: Medical research full E2E

on:
  push:
    branches:
      - main
      - dicom-he-v1
  pull_request:
    branches:
      - main

jobs:
  full-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/pip install --upgrade pip
          backend/.venv/bin/pip install -r requirements.txt

      - name: Start Ganache, compile, deploy, contract test
        run: |
          chmod +x scripts/setup_ethereum_local.sh
          ./scripts/setup_ethereum_local.sh

      - name: Test Python Ethereum adapter
        run: backend/.venv/bin/python scripts/test_ethereum_adapter.py

      - name: Start IPFS
        run: |
          docker run -d --name medical-ipfs \
            --user 0 \
            -p 127.0.0.1:5001:5001 \
            --entrypoint sh \
            ipfs/kubo:v0.43.1 \
            -c 'export IPFS_PATH=/data/ipfs; mkdir -p "$IPFS_PATH"; ipfs init; ipfs config Addresses.API /ip4/0.0.0.0/tcp/5001; exec ipfs daemon --offline'
          for i in $(seq 1 180); do
            if docker logs medical-ipfs 2>&1 | grep -q "Daemon is ready"; then
              echo "IPFS: PASS"
              exit 0
            fi
            sleep 1
          done
          docker logs medical-ipfs
          exit 1

      - name: Install Microsoft SEAL 4.4
        run: |
          git clone --depth 1 --branch v4.4.0 https://github.com/microsoft/SEAL.git /tmp/SEAL
          cmake -S /tmp/SEAL -B /tmp/SEAL/build -DSEAL_BUILD_EXAMPLES=OFF -DSEAL_BUILD_TESTS=OFF
          cmake --build /tmp/SEAL/build -j2
          sudo cmake --install /tmp/SEAL/build

      - name: Build HE binaries
        run: |
          cmake -S seal_demo -B seal_demo/build
          cmake --build seal_demo/build -j2
          test -x seal_demo/build/hospital_encrypt
          test -x seal_demo/build/researcher_compute
          test -x seal_demo/build/hospital_decrypt
          test -x seal_demo/build/researcher_sum
          test -x seal_demo/build/hospital_decrypt_sum
          test -x seal_demo/build/dicom_hospital_encrypt_stats
          test -x seal_demo/build/dicom_researcher_compute_stats
          test -x seal_demo/build/dicom_hospital_decrypt_stats
          test -x seal_demo/build/dicom_hospital_encrypt_raw
          test -x seal_demo/build/dicom_researcher_compute_raw

      - name: DICOM regression
        run: |
          PYTHONPATH=. backend/.venv/bin/python scripts/test_dicom_series.py
          PYTHONPATH=. backend/.venv/bin/python scripts/test_dicom_he_stats.py

      - name: Full backend end-to-end
        run: |
          backend/.venv/bin/python scripts/test_ethereum_backend_e2e.py
          PYTHONPATH=. backend/.venv/bin/python scripts/test_dicom_he_backend_e2e.py

  decentralized-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install RPC adapter dependencies
        run: python -m pip install "fastapi>=0.115,<1" "web3>=7,<8"
      - name: Start four-validator Besu and three-peer IPFS network
        run: bash scripts/setup_decentralized_demo.sh
      - name: Verify distinct nodes, shared state and outage recovery
        run: PYTHONPATH=. python scripts/test_decentralized_topology.py
