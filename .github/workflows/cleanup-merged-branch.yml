name: One-time branch cleanup

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  delete-migration-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged migration branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/ethereum-solidity-ganache-migration"
